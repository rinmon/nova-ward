<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="description" content="NOVA WARD — トップダウンスペースシューター" />
  <title>NOVA WARD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game" width="480" height="720"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <div class="hud-label">SCORE</div>
        <div id="score">0</div>
        <div class="hud-label">WAVE</div>
        <div id="wave">1</div>
      </div>
      <div class="hud-right">
        <div class="hud-label">LIVES</div>
        <div id="lives">■■■</div>
        <div id="power-pills"></div>
      </div>
      <button id="btn-pause" type="button" aria-label="一時停止">Ⅱ</button>
    </div>

    <div id="overlay" class="overlay">
      <div id="panel-start" class="panel">
        <p class="eyebrow">TOP-DOWN SPACE SHOOTER</p>
        <h1>NOVA WARD</h1>
        <p class="tagline">敵の波を撃ち落とし、虚空を守れ。</p>
        <ul class="controls-hint">
          <li><kbd>WASD</kbd> / <kbd>←→↑↓</kbd> 移動</li>
          <li>マウス / タッチで追従</li>
          <li>自動射撃 · <kbd>P</kbd> / <kbd>Esc</kbd> 一時停止 · <kbd>M</kbd> ミュート</li>
        </ul>
        <button id="btn-start" class="btn primary" type="button">出撃</button>
        <button id="btn-scores-open" class="btn ghost" type="button">ハイスコア</button>
        <button id="btn-mute" class="btn ghost" type="button">ミュート</button>
      </div>

      <div id="panel-pause" class="panel hidden">
        <h2>一時停止</h2>
        <button id="btn-resume" class="btn primary" type="button">再開</button>
        <button id="btn-restart" class="btn" type="button">最初から</button>
        <button id="btn-quit" class="btn ghost" type="button">タイトルへ</button>
      </div>

      <div id="panel-over" class="panel hidden">
        <h2>GAME OVER</h2>
        <p class="final-score">SCORE <span id="final-score">0</span></p>
        <p id="new-record" class="new-record hidden">NEW RECORD!</p>
        <label class="name-row">
          <span>名前</span>
          <input id="player-name" maxlength="12" placeholder="GUEST" autocomplete="off" />
        </label>
        <button id="btn-submit" class="btn primary" type="button">スコア登録</button>
        <button id="btn-retry" class="btn" type="button">再出撃</button>
        <button id="btn-title" class="btn ghost" type="button">タイトルへ</button>
      </div>

      <div id="panel-scores" class="panel hidden">
        <h2>ハイスコア</h2>
        <ol id="score-list"></ol>
        <button id="btn-scores-close" class="btn" type="button">戻る</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
